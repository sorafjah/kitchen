<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>大混雑キッチン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* レイアウト：全画面の3Dキッチン。上に注文伝票、下に「てもと」、重なる形で説明カード */
:root {
  --ink: #1f2a44;
  --paper: #ffffff;
  --wall: #cfe9e1;
  --soft: #eef3f7;
  --butter: #ffd75e;
  --tomato: #e2483d;
  --pA: #2f7de1;
  --pB: #ef8423;
  --good: #2fae5f;
  --warn: #f2b632;
  --shade: rgba(31, 42, 68, .55);
  --f: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
  color-scheme: light;
}
html, body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--wall); color: var(--ink); font-family: var(--f);
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
rt { font-size: .5em; font-weight: 400; }
button { font-family: var(--f); color: var(--ink); }

/* ---- 注文伝票 ---- */
#orders {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; right: 230px;
  display: flex; gap: 10px; align-items: flex-start; pointer-events: none; z-index: 5;
}
.ticket {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 6px 6px 14px 14px;
  width: 128px; padding: 4px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  box-shadow: 0 4px 0 rgba(31,42,68,.25); animation: drop .45s cubic-bezier(.2,1.6,.4,1);
  position: relative;
}
.ticket::before { /* 伝票のピン */
  content: ''; position: absolute; top: -7px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--tomato); border: 2px solid var(--ink);
}
.ticket .no { font-size: 12px; letter-spacing: .08em; opacity: .7; font-variant-numeric: tabular-nums; }
.ticket .dish { font-size: 40px; line-height: 1.05; }
.ticket .name { font-size: 14px; font-weight: 700; text-align: center; line-height: 1.25; }
.ticket .steps { display: flex; gap: 6px; font-size: 19px; }
.ticket .steps span { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.ticket .steps small { font-size: 12px; margin-top: 2px; }
.ticket .bar { height: 9px; width: 100%; background: #e2e7ee; border-radius: 5px; overflow: hidden; margin-top: 3px; }
.ticket .bar i { display: block; height: 100%; width: 100%; background: var(--good); }
.ticket.hurry .bar i { background: var(--warn); }
.ticket.danger { border-color: var(--tomato); animation: wobble .5s infinite; }
.ticket.danger .bar i { background: var(--tomato); }
.ticket.out-served { animation: served .45s forwards; }
.ticket.out-miss { animation: missed .45s forwards; }
@keyframes drop { from { transform: translateY(-120%) rotate(-6deg); } to { transform: none; } }
@keyframes wobble { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes served { to { transform: translateY(-40px) scale(1.15); opacity: 0; } }
@keyframes missed { to { transform: translateY(30px) rotate(10deg); opacity: 0; } }

/* ---- 右上 ---- */
#stat {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px;
  display: flex; gap: 8px; align-items: center; z-index: 6;
}
.pill {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 12px;
  padding: 4px 10px; display: flex; flex-direction: column; align-items: center; min-width: 64px;
}
.pill small { font-size: 12px; }
.pill b { font-size: 22px; font-variant-numeric: tabular-nums; }
#helpBtn {
  width: 56px; height: 56px; border-radius: 50%; font-size: 28px; font-weight: 700;
  background: var(--butter); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); cursor: pointer;
}
#helpBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
#ver { position: fixed; top: calc(76px + env(safe-area-inset-top, 0px)); right: 12px; font-size: 11px; opacity: .55; z-index: 6; }

/* ---- てもと ---- */
.hand {
  position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  min-width: 190px; height: 66px; background: var(--paper); border: 4px solid var(--ink); border-radius: 16px;
  display: flex; align-items: center; gap: 10px; padding: 0 14px; pointer-events: none;
  box-shadow: 0 4px 0 rgba(31,42,68,.25);
}
.hand .tag { font-size: 13px; font-weight: 700; color: #fff; background: var(--ink); border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
.hand .emo { font-size: 38px; line-height: 1; }
.hand .txt { font-size: 17px; font-weight: 700; white-space: nowrap; }
.hand.bump { animation: bump .2s; }
@keyframes bump { 50% { transform: scale(1.08); } }
body.solo #handA { left: 50%; transform: translateX(-50%); }
body.solo #handA.bump { animation: bumpC .2s; }
@keyframes bumpC { 50% { transform: translateX(-50%) scale(1.08); } }
body.solo #handB { display: none; }
body.duo #handA { left: 14px; border-color: var(--pA); }
body.duo #handA .tag { background: var(--pA); }
body.duo #handB { right: 14px; border-color: var(--pB); }
body.duo #handB .tag { background: var(--pB); }
#divider {
  position: fixed; top: 0; bottom: 0; width: 0; border-left: 3px dashed rgba(31,42,68,.35);
  pointer-events: none; z-index: 2; display: none;
}
body.duo #divider { display: block; }

/* ---- 吹き出し・ポップ ---- */
.toast {
  position: fixed; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 7;
  background: var(--ink); color: #fff; font-size: 19px; font-weight: 700; padding: 10px 16px; border-radius: 12px;
  opacity: 0; transition: opacity .2s, transform .2s; transform: translateY(8px); pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: none; }
body.solo #toastA { left: 50%; translate: -50% 0; }
body.solo #toastB { display: none; }
body.duo #toastA { left: 14px; background: var(--pA); }
body.duo #toastB { right: 14px; background: var(--pB); }
.pop {
  position: fixed; z-index: 8; pointer-events: none; font-weight: 700; font-size: 26px; white-space: nowrap;
  color: var(--ink); background: var(--butter); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 12px;
  translate: -50% -50%; animation: pop 1.1s forwards;
}
@keyframes pop { 0% { transform: scale(.4); } 20% { transform: scale(1.1); } 70% { transform: translateY(-40px); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }

/* ---- オーバーレイ ---- */
.ov {
  position: fixed; inset: 0; z-index: 20; background: var(--shade);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.card {
  background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
  width: 100%; max-width: 900px; max-height: calc(100% - 8px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 22px 26px; box-sizing: border-box; box-shadow: 0 8px 0 rgba(31,42,68,.35);
}
.btn {
  min-height: 60px; min-width: 150px; font-size: 24px; font-weight: 700; padding: 8px 24px;
  border-radius: 16px; border: 3px solid var(--ink); background: var(--butter);
  box-shadow: 0 5px 0 var(--ink); cursor: pointer;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.sub { background: var(--paper); font-size: 20px; min-width: 120px; }
.btn:focus-visible, #helpBtn:focus-visible { outline: 4px solid var(--pA); outline-offset: 3px; }
.row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

/* タイトル */
.logo { text-align: center; margin: 4px 0 6px; display: flex; flex-direction: column; align-items: center; }
.logo .big {
  display: inline-block; font-size: clamp(40px, 7vw, 68px); font-weight: 700; letter-spacing: .04em;
  color: var(--paper); background: var(--tomato); border: 4px solid var(--ink); border-radius: 14px;
  padding: 4px 22px 8px; transform: rotate(-2deg); box-shadow: 6px 6px 0 var(--ink);
}
.logo .big rt { color: var(--paper); font-size: .32em; }
.shop { display: inline-block; margin-top: 14px; font-size: 20px; font-weight: 700; letter-spacing: .1em; border-bottom: 4px solid var(--butter); padding: 0 6px 2px; }
.lead { text-align: center; font-size: 18px; margin: 14px 0 18px; line-height: 1.7; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.choice {
  border: 3px solid var(--ink); border-radius: 18px; background: var(--soft); padding: 14px 16px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 120px; box-shadow: 0 5px 0 var(--ink);
  font-size: 16px; line-height: 1.5; text-align: center;
}
.choice:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.choice .ic { font-size: 46px; line-height: 1.1; }
.choice .t { font-size: 26px; font-weight: 700; }
.choice.lv1 { background: #e3f5e8; } .choice.lv2 { background: #fff4cf; } .choice.lv3 { background: #fde2dd; }
.back { margin-top: 18px; }

/* 説明 */
.howto h2 { margin: 0 0 12px; font-size: 28px; text-align: center; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.hbox { border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; background: var(--soft); font-size: 17px; line-height: 1.7; min-width: 0; }
.hbox h3 { margin: 0 0 6px; font-size: 19px; }
.hbox.wide { grid-column: 1 / -1; }
.flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.flow .rec { font-weight: 700; min-width: 7.5em; }
.node { display: flex; flex-direction: column; align-items: center; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 4px 8px; min-width: 64px; font-size: 14px; line-height: 1.3; }
.node b { font-size: 30px; line-height: 1.15; }
.arr { font-size: 22px; font-weight: 700; }
.tapdemo { display: flex; align-items: center; gap: 10px; font-size: 16px; flex-wrap: wrap; }
.finger { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--butter); display: grid; place-items: center; font-size: 24px; }
.gauges { display: flex; gap: 10px; flex-wrap: wrap; }
.gauges div { display: flex; flex-direction: column; align-items: center; font-size: 14px; gap: 3px; }
.g { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); }
.g1 { background: conic-gradient(#5aa9f0 0 45%, #fff 45%); }
.g2 { background: var(--good); }
.g3 { background: var(--tomato); }
.g4 { background: #2b211b; }
.ipad { display: grid; grid-template-columns: 1fr auto 1fr; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; min-height: 96px; }
.ipad > div { padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; font-size: 15px; line-height: 1.5; }
.ipad .l { background: #dbe9fb; } .ipad .m { background: var(--butter); border-inline: 3px dashed var(--ink); font-weight: 700; } .ipad .r { background: #fde6cf; }
.ipad b { font-size: 18px; }
.ipad .ems { font-size: 26px; }
.start { margin: 16px -26px -22px; padding: 12px 16px 16px; position: sticky; bottom: -22px; background: var(--paper); border-top: 3px solid var(--ink); }

/* 結果 */
.result { text-align: center; }
.stars { font-size: 70px; letter-spacing: .1em; line-height: 1.2; }
.stars .off { color: #cfd6df; }
.stars .on { color: #f5b301; text-shadow: 0 3px 0 var(--ink); }
.nums { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 12px 0 18px; }
.nums div { border: 3px solid var(--ink); border-radius: 14px; padding: 8px 14px; background: var(--soft); font-size: 16px; }
.nums b { font-size: 30px; display: block; font-variant-numeric: tabular-nums; }
.msg { font-size: 22px; font-weight: 700; margin: 4px 0; }

#rotate .card { max-width: 420px; text-align: center; font-size: 22px; line-height: 1.7; }
#rotate .ic { font-size: 70px; display: inline-block; animation: turn 2s infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ===================== CORE（描画と切り離したゲームロジック） =====================
// ここは純粋なJS。Node.jsのシミュレーションと、HTML本体の両方で同じコードを使う。

const CFG = {
  version: 'v2026-10-09-2',
  // ---- レベルごとの設定（数値だけ直せばバランスが変わる） ----
  levels: {
    1: {
      name: 'レベル1', roundTime: 150,
      menu: ['burger'], crates: ['patty'], boards: 0,
      maxOrders: 1, duoMaxOrders: 2,   // 1人用は注文1つずつ（2人用は2つまで）
      orderInterval: 2, emptyDelay: 1.5,
      orderTime: 0,                    // 0 = 時間切れなし
      cookTime: 5, burnGrace: 14,      // 焼けてから焦げるまで14秒
      chopTaps: 4, autoPlate: true, guide: true,
    },
    2: {
      name: 'レベル2', roundTime: 150,
      menu: ['burger', 'tomatoBurger'], crates: ['patty', 'tomato'], boards: 2,
      maxOrders: 2, duoMaxOrders: 3,
      orderInterval: 20, emptyDelay: 2,
      orderTime: 75,
      cookTime: 6, burnGrace: 8,
      chopTaps: 4, autoPlate: false, guide: false,
    },
    3: {
      name: 'レベル3', roundTime: 150,
      menu: ['burger', 'tomatoBurger', 'blt'], crates: ['patty', 'bacon', 'tomato', 'lettuce'], boards: 2,
      maxOrders: 3, duoMaxOrders: 3, duoIntervalMul: 1.0,  // 2人用は右の人の仕事が多いので注文ペースは1人用と同じ
      orderInterval: 15, emptyDelay: 2,
      orderTime: 70,
      cookTime: 6, burnGrace: 7,
      chopTaps: 5, autoPlate: false, guide: false,
    },
  },
  duoIntervalMul: 0.7,       // 2人用は注文が少し早く来る
  stars: {                   // 星1・2・3に必要な皿数
    solo: { 1: [3, 6, 9], 2: [2, 4, 6], 3: [2, 4, 6] },
    duo:  { 1: [4, 7, 10], 2: [3, 6, 8], 3: [3, 5, 8] },
  },
  scoreBase: 100, scoreSpeedBonus: 50,
  autoPlateDelay: 0.5,
};

const ING = {
  patty:   { name: 'パティ',   cut: false, cook: true },
  bacon:   { name: 'ベーコン', cut: false, cook: true },
  tomato:  { name: 'トマト',   cut: true,  cook: false },
  lettuce: { name: 'レタス',   cut: true,  cook: false },
};
const RECIPES = {
  burger:       { name: 'ハンバーガー',           items: ['patty'] },
  tomatoBurger: { name: 'トマトバーガー',         items: ['patty', 'tomato'] },
  blt:          { name: 'ベーコンレタスバーガー', items: ['patty', 'bacon', 'lettuce'] },
};

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- 食材の判定 ----------
const isCooked = (f, L) => f.cook >= L.cookTime;
const needsCut = f => ING[f.ing].cut && !f.cut;
const canCook = (f, L) => ING[f.ing].cook && !f.burnt && (!ING[f.ing].cut || f.cut) && !isCooked(f, L);
const isReady = (f, L) => {
  const d = ING[f.ing];
  if (f.burnt) return false;
  if (d.cut && !f.cut) return false;
  if (d.cook && !isCooked(f, L)) return false;
  return true;
};
function isSubset(a, b) { // a ⊆ b（多重集合）
  const m = {};
  for (const x of b) m[x] = (m[x] || 0) + 1;
  for (const x of a) { if (!m[x]) return false; m[x]--; }
  return true;
}
const sameSet = (a, b) => a.length === b.length && isSubset(a, b);
function canAdd(S, plate, food) {
  if (food.kind !== 'food' || !isReady(food, S.L)) return false;
  const items = plate.items.concat(food.ing);
  return S.L.menu.some(r => isSubset(items, RECIPES[r].items));
}
function canMerge(S, a, b) {
  if (!a.items.length || !b.items.length) return false;
  const items = a.items.concat(b.items);
  return S.L.menu.some(r => isSubset(items, RECIPES[r].items));
}
function plateRecipe(S, plate) {
  if (!plate.items.length) return null;
  return S.L.menu.find(r => sameSet(plate.items, RECIPES[r].items)) || null;
}
function matchOrder(S, plate) {
  const r = plateRecipe(S, plate);
  if (!r) return null;
  const cands = S.orders.filter(o => o.recipe === r);
  if (!cands.length) return null;
  cands.sort((a, b) => a.left - b.left);
  return cands[0];
}

// ---------- 状態の生成 ----------
function newState(mode, level, seed = 1) {
  const L = CFG.levels[level];
  const duo = mode === 'duo';
  const S = {
    mode, level, L, duo, phase: 'play', t: 0, timeLeft: L.roundTime,
    served: 0, missed: 0, burntCount: 0, score: 0, stars: 0,
    hands: { A: null, B: null }, orders: [], orderSeq: 0,
    maxOrders: duo ? L.duoMaxOrders : L.maxOrders,
    interval: L.orderInterval * (duo && level > 1 ? (L.duoIntervalMul ?? CFG.duoIntervalMul) : 1),
    spawnTimer: 1.0, rng: mulberry32(seed), events: [], stations: {}, order: [],
  };
  const add = (o) => { S.stations[o.id] = o; S.order.push(o.id); };
  L.crates.forEach(ing => add({ id: 'crate_' + ing, type: 'crate', ing, side: 'A' }));
  for (let i = 0; i < L.boards; i++) add({ id: 'board' + i, type: 'board', side: 'A', item: null, chops: 0 });
  for (let i = 0; i < 2; i++) add({ id: 'handoff' + i, type: 'handoff', side: 'AB', item: null });
  for (let i = 0; i < 2; i++) add({ id: 'stove' + i, type: 'stove', side: 'B', item: null });
  if (!L.autoPlate) add({ id: 'plates', type: 'plates', side: 'B' });
  for (let i = 0; i < 2; i++) add({ id: 'spot' + i, type: 'spot', side: 'B', item: L.autoPlate ? newPlate() : null, refill: 0 });
  add({ id: 'bell', type: 'bell', side: 'B' });
  return S;
}
const newFood = ing => ({ kind: 'food', ing, cut: false, cook: 0, burnt: false, warned: false });
const newPlate = () => ({ kind: 'plate', items: [] });
const allowed = (S, p, s) => !S.duo || s.side.includes(p);

// ---------- タップの判定（dry run 可能） ----------
// 返り値: { act: '...' } または { fail: '理由' }
function decide(S, p, id) {
  const s = S.stations[id];
  if (!s) return { fail: 'none' };
  if (!allowed(S, p, s)) return { fail: 'area' };
  const h = S.hands[p], L = S.L;
  switch (s.type) {
    case 'crate':
      if (!h) return { act: 'take' };
      if (h.kind === 'food' && h.ing === s.ing && !h.cut && h.cook === 0) return { act: 'return' };
      return { fail: 'handfull' };
    case 'board':
      if (s.item && needsCut(s.item)) return { act: 'chop' };
      if (s.item) {

    case 'pick': S.hands[p] = s.item; s.item = null; if (s.type === 'board') s.chops = 0; ev('pick'); break;
    case 'place': s.item = S.hands[p]; S.hands[p] = null; if (s.type === 'board') s.chops = 0; ev(s.type === 'stove' ? 'toStove' : 'put'); break;
    case 'toHeldPlate': S.hands[p].items.push(s.item.ing); s.item = null; ev('plate'); break;
    case 'toPlate': s.item.items.push(S.hands[p].ing); S.hands[p] = null; ev('plate'); break;
    case 'merge': s.item.items.push(...S.hands[p].items); S.hands[p] = null; ev('plate'); break;
    case 'clean': s.item = null; ev('clean'); break;
    case 'takePlate': S.hands[p] = newPlate(); ev('pick'); break;

// ---------- 時間を進める ----------
function spawnOrder(S) {

  const last = S.orders.length ? S.orders[S.orders.length - 1].recipe : S.lastRecipe;
  if (menu.length > 1 && r === last && S.rng() < 0.6) r = menu[Math.floor(S.rng() * menu.length)];
  const total = S.L.orderTime;

  S.orders.push(o); S.lastRecipe = r;
  S.events.push({ type: 'order', orderId: o.id, recipe: r });

function update(S, dt) {

      f.cook += dt;

      if (!f.warned && f.cook >= L.cookTime + L.burnGrace * 0.6) { f.warned = true; S.events.push({ type: 'warn', station: id }); }
      if (f.cook >= L.cookTime + L.burnGrace) { f.burnt = true; S.burntCount++; S.events.push({ type: 'burnt', station: id }); }

    if (s.type === 'spot' && L.autoPlate && !s.item) {

    o.age += dt;

// ---------- 次にさわるとよい場所（ガイド矢印・シミュレーション用ボット） ----------

function itemKey(it) {
  if (!it) return '';
  if (it.kind === 'plate') return 'P:' + it.items.join(',');

}
let tNow = 0;
function playersList() { return S.duo ? ['A', 'B'] : ['A']; }
function syncStations(dt) {
  let sizzling = 0;
  const pulse = .55 + .35 * Math.sin(tNow * 7);
  for (const id of S.order) {
    const v = sv[id], s = v.s;
    if ('item' in s) {
      const k = itemKey(s.item);
      if (k !== v.key) {
        if (v.itemObj) { v.slot.remove(v.itemObj); disposeTree(v.itemObj); v.itemObj = null; }
        if (s.item) { v.itemObj = s.item.kind === 'plate' ? bunMesh(s.item.items) : foodMesh(s.item, s.type === 'stove'); v.slot.add(v.itemObj); v.itemObj.scale.setScalar(.6); }
        v.key = k;
      }
      if (v.itemObj && v.itemObj.scale.x < 1) v.itemObj.scale.setScalar(Math.min(1, v.itemObj.scale.x + dt * 5));
    }
    if (s.type === 'stove') {
      const f = s.item;
      if (f && f.kind === 'food') {
        tintFood(v.itemObj, f);
        v.gauge.visible = true; drawGauge(v.gauge, f);
        v.gauge.position.y = .75 + (f.cook >= S.L.cookTime && !f.burnt ? Math.sin(tNow * 6) * .05 : 0);
        v.flames.visible = !f.burnt;
        if (!f.burnt) {
          sizzling++;
          v.flames.children.forEach((fl, i) => fl.scale.y = .7 + .5 * Math.abs(Math.sin(tNow * 13 + i)));
          const over = (f.cook - S.L.cookTime) / S.L.burnGrace;
          if (Math.random() < dt * (over > .5 ? 10 : 3)) emitPuff(v.lay.x, .6, v.lay.z, over > .5 ? 0x777777 : 0xffffff, over > .5 ? .5 : .35, .9, 1.2);
        } else if (Math.random() < dt * 8) emitPuff(v.lay.x, .6, v.lay.z, 0x444444, .55, 1.0, 1.4);
      } else { v.gauge.visible = false; v.flames.visible = false; }
    }
    if (s.type === 'board') {
      const need = s.item && needsCut(s.item);
      v.pips.visible = !!need;
      if (need) drawPips(v.pips, s.chops, S.L.chopTaps);
      v.anim = Math.max(0, v.anim - dt * 6);
      v.knife.position.y = .14 + Math.sin(v.anim * Math.PI) * .25;
      v.knife.rotation.z = -Math.sin(v.anim * Math.PI) * .4;
    }
    if (s.type === 'spot') {
      const ok = s.item && plateRecipe(S, s.item) && matchOrder(S, s.item);
      v.done.visible = !!ok;
      if (ok) v.done.position.y = 1.05 + Math.sin(tNow * 5) * .06;
    }
    if (s.type === 'bell') { v.anim = Math.max(0, v.anim - dt * 3); v.bell.scale.setScalar(1.3 + Math.sin(v.anim * Math.PI * 3) * .12 * v.anim); }

    // 光るわく：いま持っている物を置ける場所・すぐ手を打つべき場所
    let col = null;
    for (const p of playersList()) {
      if (!S.hands[p]) continue;
      const d = decide(S, p, id);
      if (d.act && d.act !== 'chop') col = col !== null ? 0xffffff : (S.duo ? COL[p] : COL.solo);
    }
    if (s.type === 'stove' && s.item && !s.item.burnt && isCooked(s.item, S.L)) col = COL.ok;
    if (s.type === 'spot' && v.done.visible) col = COL.ok;
    if (s.type === 'stove' && s.item && s.item.burnt) col = COL.bad;
    if (col !== null) { v.glow.material.color.setHex(col); v.glow.material.opacity = pulse; }
    else v.glow.material.opacity = 0;
  }
  Snd.sizzle(running && !paused ? sizzling : 0);
  // ガイド矢印
  for (const p of ['A', 'B']) {
    const a = arrows[p]; if (!a) continue;
    const show = running && S.L.guide && playersList().includes(p);
    const target = show ? plan(S, p) : null;
    a.visible = !!target;
    if (target) {
      const v = sv[target];
      a.position.set(v.lay.x, 1.1 + Math.abs(Math.sin(tNow * 4)) * .2, v.lay.z - .1);
      if (S.duo && target.startsWith('handoff')) a.position.x += p === 'A' ? -.35 : .35;
    }
  }
}

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tapPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -.3), _hit = new THREE.Vector3();
function pickStation(x, y) {
  // 台の床面（高さ0.3）との交点が、どの台の範囲に入るかで決める。
  // 背の高い当たり箱だと、斜めのカメラでは手前の台が奥の台に重なって取り違えるため。
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(tapPlane, _hit)) {
    let best = null, bd = Infinity;
    for (const id of S.order) {
      const { lay } = sv[id];
      const dx = Math.abs(_hit.x - lay.x) - lay.w / 2, dz = Math.abs(_hit.z - lay.z) - lay.d / 2;
      const out = Math.max(dx, dz, 0);
      if (out < .25 && out < bd) { bd = out; best = id; }   // 少し外れても一番近い台を選ぶ
    }
    if (best) return best;
  }
  let best = null, bd = 60;
  for (const id of S.order) {
    const v = sv[id], p = toScreen(v.lay.x, .2, v.lay.z);
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < bd) { bd = d; best = id; }
  }
  return best;
}
canvas.addEventListener('pointerdown', e => {

  const id = pickStation(e.clientX, e.clientY);
  if (!id) return;
  tap(S, p, id);
  processEvents();
});

function fitCamera() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const target = new THREE.Vector3(-.3, 0, -.35);
  const dir = new THREE.Vector3(0, 1, .62).normalize();
  const vf = THREE.MathUtils.degToRad(camera.fov);
  const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const dist = Math.max(8.4 / Math.tan(hf / 2), 4.9 / Math.tan(vf / 2));
  camera.position.copy(target).addScaledVector(dir, dist);
  camera.lookAt(target);
  camera.updateProjectionMatrix();
  const portrait = h > w * 1.05;
  $('rotate').hidden = !portrait;
  rotatePause = portrait;
}

  const th = CFG.stars[S.duo ? 'duo' : 'solo'][S.level];
  const stars = [0, 1, 2].map(i => `<span class="${i < S.stars ? 'on' : 'off'}">★</span>`).join('');
  const msg = ['もう いちど チャレンジ！', 'いい ちょうし！', 'すごい！ おきゃくさんも にっこり！', 'だいせいこう！ にんきの バーガーやさん！'][S.stars];
  const next = S.stars < 3 ? `<p>★を ふやすには あと <b>${th[S.stars] - S.served}</b> こ</p>` : '';
  $('resultCard').innerHTML = `
    <h2 style="margin:0;font-size:30px">しゅうりょう！</h2>
    <div class="stars">${stars}</div>
    <p class="msg">${msg}</p>${next}
    <div class="nums">
      <div>できた バーガー<b>${S.served} こ</b></div>
      ${S.L.orderTime ? `<div>まにあわなかった<b>${S.missed}</b></div>` : ''}
      <div>こげた<b>${S.burntCount}</b></div>
      <div>てんすう<b>${S.score}</b></div>
    </div>
    <div class="row"><button class="btn sub" id="menuBtn">メニューへ</button><button class="btn" id="againBtn">もういちど</button></div>`;
  $('resultOv').hidden = false;
  $('againBtn').addEventListener('click', () => startGame(S.mode, S.level));
  $('menuBtn').addEventListener('click', () => showTitle('mode'));
}

// ---------- ゲームループ ----------
const G = { frames: 0, elapsed: 0 };
let lastT = performance.now();
function syncAll(dt) {
  tNow += dt;
  if (!S) return;
  const sp = toScreen(HANDOFF_X, 0, 0); splitX = sp.x;
  $('divider').style.left = splitX + 'px';
  syncStations(dt);
  updatePuffs(dt);
  syncOrders();
  syncHands();
  $('timeV').textContent = fmtTime(S.timeLeft);
  $('servedV').textContent = S.served;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 1 / 30);   // 1/30秒でクランプ（120Hzでも速さは同じ）
  lastT = now;
  G.frames++;
  if (S && running && !paused && !rotatePause) { update(S, dt); G.elapsed += dt; processEvents(); }
  syncAll(dt);
  renderer.render(scene, camera);
}

// ---------- テスト用フック ----------
// エンティティ（食材・皿）の位置は .position ではなく CORE の状態（S.stations[id].item / S.hands）で決まり、
// 表示は毎フレーム syncStations() がそれに合わせて作り直す。外から動かすときは api.tap() を使うこと。
window.__game = {
  get state() { return S; },
  get stations() { return sv; },
  camera, scene, Core,
  get frames() { return G.frames; },
  get elapsed() { return G.elapsed; },
  get running() { return running; },
  get paused() { return paused; },
  api: {
    start(mode = 'solo', level = 1, seed = 1) { startGame(mode, level, seed); },
    begin() { $('howtoOv').hidden = true; running = true; paused = false; },
    tick(n = 1, dt = 1 / 60) {
      for (let i = 0; i < n; i++) { if (S && S.phase === 'play') { update(S, dt); G.elapsed += dt; processEvents(); } syncAll(dt); }
      renderer.render(scene, camera);
    },
    tap(player, id) { const r = tap(S, player, id); processEvents(); return r; },
    plan(player = 'A') { return plan(S, player); },
    screenPos(id) { const v = sv[id]; return toScreen(v.lay.x, .2, v.lay.z); },
    getState() {
      return {
        phase: S.phase, timeLeft: S.timeLeft, served: S.served, missed: S.missed, burnt: S.burntCount, score: S.score,
        hands: JSON.parse(JSON.stringify(S.hands)), orders: S.orders.map(o => ({ id: o.id, recipe: o.recipe, left: o.left })),
        items: Object.fromEntries(S.order.filter(id => 'item' in S.stations[id]).map(id => [id, S.stations[id].item])),
      };
    },
  },
};

// ---------- 起動 ----------
fitCamera();
showTitle('mode');
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  // タイトルの後ろに見本のキッチンを出しておく
  S = newState('solo', 3, 7); buildStations(); fitCamera();
});
requestAnimationFrame(frame);
</script>
</body>
